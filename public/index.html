<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 3단계 로그인 자료실</title>
  <style>
    :root { color-scheme:dark; font: 16px system-ui, -apple-system, sans-serif; }
    * { box-sizing:border-box; } body {margin:0;background:#101a28;color:#ecf4ff}
    main{max-width:850px;margin:0 auto;padding:42px 20px 80px}
    .eyebrow{color:#8ad8df;letter-spacing:.1em;font-size:14px;font-weight:700}
    h1{font-size:clamp(28px,6vw,45px);line-height:1.2;margin:14px 0}
    p{color:#bfcee2;line-height:1.65}.notice{padding:14px 16px;margin:18px 0;border:1px solid #718298;border-radius:12px}
    .panel{background:#1b2b3e;padding:20px;border:1px solid #3b526b;border-radius:14px;margin-top:20px}
    label{display:block;font-size:14px;color:#c5d5e8;margin-top:14px}
    input,textarea{background:#0f1b2b;color:#fff;width:100%;padding:12px 13px;margin-top:6px;border:1px solid #647890;border-radius:8px;font:inherit}
    textarea{min-height:96px;resize:vertical}
    button{padding:10px 14px;background:#258fa1;color:#fff;border:0;border-radius:8px;font:inherit;cursor:pointer;margin:10px 7px 0 0}
    button.secondary{background:#32485f}
    button.danger{background:#864454}
    button:disabled{opacity:.6;cursor:wait}
    .hidden{display:none!important}
    ul{list-style:none;padding:0;display:grid;gap:12px}
    li{padding:18px;background:#1b2b3e;border:1px solid #3b526b;border-radius:12px;overflow-wrap:anywhere}
    li strong{font-size:18px}li p{white-space:pre-wrap;margin:10px 0}
    small,.muted{color:#b8c7dc}.actions{display:flex;flex-wrap:wrap}
    #status{min-height:25px;color:#a8eece;white-space:pre-wrap}
    #auth-status{font-size:14px;color:#d4e6ff}
  </style>
</head>
<body>
 <main>
  <div class="eyebrow">BYTE BACK · 3단계</div>
  <h1>진짜 로그인을 붙인 자료실</h1>
  <p>Supabase Auth로 로그인하고 Vercel 서버에서 인증 토큰을 검증합니다.</p>
  <div class="notice">이 자료실은 가상 자료 전용입니다. 현재 3단계는 로그인 검증까지 적용하며, 다른 사용자의 메모 ID 접근에 대한 소유자 검사는 4단계 과제입니다.</div>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="login-panel" class="panel">
   <h2>이메일 로그인</h2>
   <form id="login-form">
    <label>이메일 <input id="email" type="email" autocomplete="email" required maxlength="254"></label>
    <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <button type="submit">로그인</button>
    <button type="button" id="signup" class="secondary">학습용 계정 만들기</button>
   </form>
   <p class="muted">새 계정은 이메일 인증이 필요할 수 있습니다. 이메일과 비밀번호를 채팅 또는 GitHub에 공유하지 마세요.</p>
  </section>
  <section id="vault-panel" class="hidden">
   <div class="panel">
    <p id="auth-status"></p>
    <button id="logout" class="secondary">로그아웃</button>
   </div>
   <form id="create-form" class="panel">
    <h2 id="editor-label">메모 추가</h2>
    <label>제목 <input id="title" required maxlength="120"></label>
    <label>내용 <textarea id="body" required maxlength="5000"></textarea></label>
    <button type="submit" id="save">저장</button>
    <button type="button" id="cancel" class="secondary hidden">수정 취소</button>
   </form>
   <h2>가상 메모</h2>
   <ul id="notes" aria-live="polite"></ul>
  </section>
 </main>
 <script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';
  const SUPABASE_URL = 'https://bcwzllejypavwgsfqfbm.supabase.co';
  // Publishable SDK key is public. Never put SUPABASE_SECRET_KEY here.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rQOSzVLPSmRGAAGfnV5CVw_ZsyWj-4Z";
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true },
  });
  const $ = selector => document.querySelector(selector);
  const status = message => { $('#status').textContent = message; };
  let session = null, list = [], editingId = null;
  function cleanEditor() {
    editingId = null;
    $('#create-form').reset();
    $('#editor-label').textContent = '메모 추가';
    $('#cancel').classList.add('hidden');
  }
  function showLoggedIn(loggedIn) {
    $('#login-panel').classList.toggle('hidden',loggedIn);
    $('#vault-panel').classList.toggle('hidden',!loggedIn);
    if(!loggedIn){list=[];$('#notes').replaceChildren();cleanEditor();}
  }
  async function api(path,options={}) {
    const current = await supabase.auth.getSession();
    const token = current.data.session?.access_token;
    if(!token)throw new Error('로그인이 필요합니다.');
    const resp=await fetch(path,{
      method:options.method??'GET',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      cache:'no-store',
      body:options.body?JSON.stringify(options.body):undefined,
    });
    let result;
    try{result=await resp.json();}catch{throw new Error('서버가 JSON 응답을 보내지 않았습니다.');}
    if(!resp.ok)throw new Error('요청 실패 ('+resp.status+'): '+(result.error??'알 수 없는 오류'));
    return result;
  }
  function displayNotes() {
    const ul=$('#notes');ul.replaceChildren();
    if(list.length===0){const li=document.createElement('li');li.textContent='저장된 메모가 없습니다.';ul.append(li);}
    for(const note of list){
      const li=document.createElement('li'), title=document.createElement('strong'), body=document.createElement('p');
      title.textContent=note.title;body.textContent=note.body;
      const actions=document.createElement('div');actions.className='actions';
      const edit=document.createElement('button');edit.textContent='수정';edit.className='secondary';
      edit.addEventListener('click',()=>{
        editingId=note.id;$('#title').value=note.title;$('#body').value=note.body;
        $('#editor-label').textContent='메모 수정';$('#cancel').classList.remove('hidden');
        $('#create-form').scrollIntoView({behavior:'smooth'});
      });
      const del=document.createElement('button');del.textContent='삭제';del.className='danger';
      del.addEventListener('click',async()=>{
        if(!confirm('이 가상 메모를 삭제하시겠습니까?'))return;
        try{await api('/api/notes/'+encodeURIComponent(note.id),{method:'DELETE'});
        status('메모를 삭제했습니다.');await loadNotes();}catch(err){status(err.message);}
      });
      actions.append(edit,del);li.append(title,body,actions);ul.append(li);
    }
  }
  async function loadNotes() {
    const data=await api('/api/notes');
    if(!Array.isArray(data.notes))throw new Error('메모 응답 형식 오류');
    list=data.notes;displayNotes();
  }
  async function onSession(next) {
    session=next;showLoggedIn(Boolean(next));
    if(next){
      $('#auth-status').textContent='로그인됨: '+(next.user?.email??'인증된 사용자');
      try{await loadNotes();status('로그인되었습니다.');}catch(e){status(e.message);}
    } else {status('로그인이 필요합니다.');}
  }
  $('#login-form').addEventListener('submit',async event=>{
    event.preventDefault();
    const email=$('#email').value.trim(), password=$('#password').value;
    status('로그인 확인 중...');
    const {error}=await supabase.auth.signInWithPassword({email,password});
    $('#password').value='';
    if(error)status('로그인 실패: '+error.message);
  });
  $('#signup').addEventListener('click',async()=>{
    const email=$('#email').value.trim(),password=$('#password').value;
    if(!email||!password){status('이메일과 비밀번호를 입력하세요.');return;}
    const {data,error}=await supabase.auth.signUp({email,password});
    $('#password').value='';
    if(error)status('계정 생성 실패: '+error.message);
    else if(!data.session)status('계정 생성 요청을 받았습니다. 이메일 확인 안내를 확인하세요.');
    else status('학습용 계정이 만들어졌습니다.');
  });
  $('#logout').addEventListener('click',async()=>{
    const {error}=await supabase.auth.signOut();
    if(error)status('로그아웃 실패: '+error.message);
  });
  $('#create-form').addEventListener('submit',async event=>{
    event.preventDefault();
    const title=$('#title').value.trim(),body=$('#body').value.trim();
    try{
      if(editingId)await api('/api/notes/'+encodeURIComponent(editingId),{method:'PUT',body:{title,body}});
      else await api('/api/notes',{method:'POST',body:{title,body}});
      status(editingId?'메모 수정 완료':'메모 추가 완료');
      cleanEditor();await loadNotes();
    }catch(err){status(err.message);}
  });
  $('#cancel').addEventListener('click',cleanEditor);
  supabase.auth.onAuthStateChange((_event,newSession)=>{setTimeout(()=>{void onSession(newSession);},0);});
  const {data:{session:initialSession},error}=await supabase.auth.getSession();
  if(error)status('인증 상태 확인 실패: '+error.message);
  else await onSession(initialSession);
 </script>
</body>
</html>
