name: Stage 3 live verification and submission bundle

on:
  # Stage 3 evidence is preserved but will not run on a Stage 4 main push.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Stage 3 anonymous HTTP and manifest verification
        run: node scripts/verify-step3-live.mjs
      - name: Prepare ignored local submission notes
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const explanation = [
            '3단계 Supabase Auth 로그인·로그아웃과 서버 토큰 검증을 추가했습니다.',
            '검증된 사용자 ID로 가상 메모 CRUD를 수행하며 로그인 없는 API는 JSON 401입니다.',
            '4단계에서 개인 메모 소유자별 접근을 제한하며 과거 공개 이력은 유지될 수 있습니다.'
          ].join('\n');
          writeFileSync('bundle-notes.json', JSON.stringify({explanation, blockedAt:null},null,2)+'\n');
          NODE
      - name: Generate ignored submission bundle
        run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-live-and-submission
          path: |
            artifacts/stage3-live-check.json
            artifacts/submission.json
          if-no-files-found: error
          retention-days: 7
      - name: Report Stage 3 live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then RESULT="success"; else RESULT="failure"; fi
          gh api -X POST "repos/$REPOSITORY/statuses/$COMMIT_SHA" -f state="$RESULT" -f context="stage3-live-check" -f target_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID" -f description="Stage 3 anonymous HTTP and submission check: $RESULT" > /dev/null
