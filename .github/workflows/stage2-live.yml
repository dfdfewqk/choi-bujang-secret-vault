name: Stage 2 live verification and submission bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify deployed production service without exposing note text
        run: node scripts/verify-step2-live.mjs
      - name: Prepare ignored local submission notes
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const explanation = [
            '2단계에서 메모 네 건을 Supabase 서버 전용 테이블로 옮겼습니다.',
            '정적 data.json을 삭제하고 배포 manifest 및 nosniff 헤더를 유지했습니다.',
            '공개 API는 3단계 인증 적용 전까지 비로그인에서 접근 가능하며, 옛 이력은 남습니다.',
          ].join('\n');
          writeFileSync('bundle-notes.json', JSON.stringify({ explanation, blockedAt: null }, null, 2) + '\n');
          NODE
      - name: Generate uncommitted judge submission bundle
        run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-live-check-and-submission
          path: |
            artifacts/live-check.json
            artifacts/submission.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish live check status without secrets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then RESULT="success"; else RESULT="failure"; fi
          gh api -X POST "repos/$REPOSITORY/statuses/$COMMIT_SHA" \\
            -f state="$RESULT" \\
            -f context="stage2-live-check" \\
            -f target_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID" \\
            -f description="Step 2 live HTTP verification and bundle: $RESULT" > /dev/null
