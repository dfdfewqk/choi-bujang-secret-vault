name: Stage 3 implementation tests

on:
  push:
    branches: [stage3-auth-crud]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:r5
      - run: npm run test:package
      - run: node --test test/step2.test.mjs
      - run: node --test test/step2-api.test.mjs
      - run: node --test test/step3-api.test.mjs
      - run: npm run build -- --local
      - name: Verify generated city, monsters, shield assets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          for (const layer of ['city','monsters','shield']) {
            const svg = await readFile('public/assets/scene-' + layer + '.svg', 'utf8');
            assert.match(svg, /<mask id="layerMask"/);
            assert.match(svg, /data:image\/avif;base64,/);
            assert.match(svg, /mask="url\(#layerMask\)"/);
            assert.ok(svg.length > 77000, 'generated image layer unexpectedly small');
          }
          console.log('3 independent masked illustration assets generated successfully');
          NODE
