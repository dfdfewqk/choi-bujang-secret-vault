name: Stage 7 composite-anomaly decision and checkpoint bundle

on:
  push:
    branches: [stage7-composite-step-up, main]
    paths:
      - 'src/decider.mjs'
      - 'src/attack-check.mjs'
      - 'aleph.config.json'
      - 'scripts/verify-step5-live.mjs'
      - 'test/**'
      - 'README.md'
      - '.github/workflows/stage7-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve stages 2-6 and XDR regression suite
        run: |
          npm run test:r5
          npm run test:package
          node --test test/step2.test.mjs test/step2-api.test.mjs test/step3-api.test.mjs test/step4-api.test.mjs test/step5-api.test.mjs test/step5-server-auth.test.mjs
          node --test test/xdr-run.test.mjs test/xdr-brute-force.test.mjs test/xdr-web-injection.test.mjs
      - name: Stage 6 registration and Stage 7 composite anomaly
        run: |
          npm run decider:test
          npm run fixture:7
          node --test test/step7-decider.test.mjs
      - name: Check no uncommitted files before bundle
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prepare ignored stage 7 checkpoint explanation
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('bundle-notes.json',JSON.stringify({
            explanation: [
              '7단계: 기존 등록 기기 판정은 유지하며 가상 접속의 야간 시각, 비일상 네트워크, 최근 다량 risk_signal 조합에서 step_up/step_up_required를 반환합니다.',
              'source가 judge_fixture인 합성 신호만 비교하고 불명확한 지역이나 위조 클라이언트 헤더를 실측 접속 정보로 사용하지 않습니다.',
              '로컬 정상/복합 이상/엔진 재확인 가상 입력과 기존 단계 회귀를 검사합니다. 실제 새 로그인 및 확인 전 자료 응답 차단 실측은 하지 않았습니다.'
            ].join('\n'),
            blockedAt:'stage7_live_relogin_and_judge_not_tested'
          },null,2)+'\n');
          NODE
      - name: Build submission JSON for the committed Stage 7 checkpoint
        run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage7-composite-step-up-submission
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 90
