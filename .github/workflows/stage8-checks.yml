name: Stage 8 resource zones and ownership
on:
  push:
    branches: [stage8-resource-zones, main]
    paths: ['src/**', 'aleph.config.json', 'README.md', 'docs/RESOURCE_ZONES.md', 'test/**', '.github/workflows/stage8-checks.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Previous regressions
        run: |
          npm run test:r5
          npm run test:package
          node --test test/step2.test.mjs test/step2-api.test.mjs test/step3-api.test.mjs test/step4-api.test.mjs test/step5-api.test.mjs test/step5-server-auth.test.mjs test/step7-decider.test.mjs
          node --test test/xdr-run.test.mjs test/xdr-brute-force.test.mjs test/xdr-web-injection.test.mjs
          node --test test/tab-session-isolation.test.mjs
      - name: Local stage 6-8 decisions and resource isolation
        run: |
          npm run decider:test
          npm run fixture:7
          node --test test/step8-resource-zones.test.mjs test/step8-judge-binding.test.mjs
      - name: Clean checkout for bundle
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Create ignored checkpoint notes
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('bundle-notes.json',JSON.stringify({
            explanation:[
              '8단계: note:<UUID>와 announcement:<UUID>를 구분하고 자원 경로·메서드를 엄격히 확인합니다.',
              '계약에 실제 강사 역할이나 주체-소유자 관계가 없으므로 공지 요청을 모두 거부하고 개인 메모는 기존 서버 owner_id 조건으로 격리합니다.',
              '6~7단계와 기존 회귀 검사 및 가상 자원 경로 거부를 확인했습니다. 실제 A/B 및 강사 계정 심판 실측은 미실행입니다.'
            ].join('\n'),
            blockedAt:'stage8_missing_verified_instructor_and_live_ab_judge'
          },null,2)+'\n');
          NODE
      - name: Generate bundle after commit
        run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: stage8-resource-zones-submission
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 90
