name: Stage 9 verified GET burst detector and submission
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/detect.mjs'
      - 'aleph.config.json'
      - 'src/attack-check.mjs'
      - 'README.md'
      - 'test/step9-detect.test.mjs'
      - '.github/workflows/stage9-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Official Stage 9 six-case local fixture
        run: npm run detect:test
      - name: Stage 9 exact-boundary and malformed-event regression
        run: node --test test/step9-detect.test.mjs
      - name: Preserve former stage ownership and access checks
        run: |
          npm run test:r5
          npm run test:package
          npm run decider:test
          npm run fixture:7
          node --test test/step8-scoped-policy.test.mjs test/step8-resource-zones.test.mjs test/step8-judge-binding.test.mjs test/step8-signed-jwt-end-to-end.test.mjs
          node --test test/xdr-brute-force.test.mjs test/xdr-web-injection.test.mjs test/xdr-known-cve.test.mjs test/xdr-persistence.test.mjs test/xdr-exfiltration.test.mjs
      - name: Confirm only committed changes before building bundle
        run: |
          git status --short
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Create ignored stage 9 explanation for submission
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('bundle-notes.json',JSON.stringify({
            explanation:[
              '9단계: 엔진이 확인한 사건의 at·method·identity.sub만 이용하고 다른 필드를 가정하지 않습니다.',
              '같은 가명 사용자 GET이 10분 안에 121건부터 propose_revocation/burst_read를 제안합니다. 120건, 정상과 서로 다른 사용자는 observe입니다.',
              '권한 회수는 엔진 담당이며 API·기기·기존 8단계 정책을 변경하지 않았습니다. 로컬 가상 사건 6개와 회귀 검사를 실행했습니다.'
            ].join('\\n'),
            blockedAt:null
          },null,2)+'\\n');
          NODE
      - name: Bundle official checkpoint after commit
        run: npm run bundle
      - name: Display safe bundle summary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const b=JSON.parse(readFileSync('artifacts/submission.json','utf8'));
          const outcomes=b.attackAttempts.filter(x=>x.attackId.startsWith('stage9_'));
          const failures=outcomes.filter(x=>x.observed.startsWith('FAIL'));
          console.log(JSON.stringify({schema:b.schema,step:b.step,commit:b.commit,
            changedFiles:b.changedFiles.length,policyRules:b.policyRules,
            stage9LocalChecks:outcomes.length,stage9LocalFailures:failures.length,
            totalSelfChecks:b.attackAttempts.length},null,2));
          if(b.step!==9||failures.length||outcomes.length!==4)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stage9-submission-bundle
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 90
