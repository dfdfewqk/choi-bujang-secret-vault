name: Stage 11 approved app request signatures and regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/app-request.mjs'
      - 'src/device-api.mjs'
      - 'src/notes-api.mjs'
      - 'public/**'
      - 'test/step11-app.test.mjs'
      - 'aleph.config.json'
      - '.github/workflows/stage11-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/*.test.mjs
      - run: npm run decider:test
      - run: npm run detect:test
      - name: Write truthful checkpoint explanation
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('bundle-notes.json',JSON.stringify({
            explanation:'11단계: manifest와 승인 대기 화면을 추가하고 서버의 승인 공개키로 경로·본문·JWT 지문·시각·nonce 서명을 검증합니다.\n키와 토큰은 페이지 메모리에만 유지하며 승인 전 자료를 숨기고 감사/이전 소유권·복구 검사를 보존합니다.\n로컬 서명·회귀 검사를 실행했으며 공식 HTTPS 시험과 재채점은 미실행입니다.',
            blockedAt:'stage11_official_https_and_rejudge_not_performed'
          },null,2));
          NODE
      - run: npm run bundle
      - name: Check stage 11 bundle
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const b=JSON.parse(readFileSync('artifacts/submission.json','utf8'));
          if(b.step<11||!b.attackAttempts.some(x=>x.attackId==='stage11_anonymous_device_denied'))process.exit(1);
          console.log(JSON.stringify({step:b.step,commit:b.commit,checks:b.attackAttempts.length}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stage11-submission
          path: artifacts/submission.json
          retention-days: 90
