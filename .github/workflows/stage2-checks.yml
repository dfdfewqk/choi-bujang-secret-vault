name: Stage 2 checks

on:
  push:
    branches: [stage2-protect-notes]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:r5
      - run: npm run test:package
      - run: node --test test/step2.test.mjs
      - run: npm run build -- --local
