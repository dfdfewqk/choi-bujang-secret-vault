name: Bonus XDR-06 exfiltration verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve previous stage and XDR behavior
        run: |
          npm run decider:test
          node --test test/step7-decider.test.mjs test/step8-resource-zones.test.mjs test/step8-judge-binding.test.mjs
          node --test test/xdr-run.test.mjs test/xdr-brute-force.test.mjs test/xdr-web-injection.test.mjs test/xdr-known-cve.test.mjs test/xdr-persistence.test.mjs
      - name: XDR-06 tests and sanitized fixture extraction
        run: |
          node --test test/xdr-exfiltration.test.mjs
          node xdr/exfiltration/read-alerts.mjs > /tmp/xdr06-safe.txt
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const data=JSON.parse(await readFile('xdr/fixtures/exfiltration.json','utf8'));
          const lines=(await readFile('/tmp/xdr06-safe.txt','utf8')).trim().split('\n');
          assert.equal(lines.length-1,data.alerts.length);
          for(const line of lines.slice(1))assert.equal(Object.keys(JSON.parse(line)).length,5);
          NODE
      - name: Run XDR-06 twice for reproducibility
        run: |
          npm run xdr:run -- exfiltration
          npm run xdr:run -- exfiltration
      - name: Verify counts, normal request safety and expiring rules
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const src=JSON.parse(await readFile('xdr/fixtures/exfiltration.json','utf8'));
          const r=JSON.parse(await readFile('xdr/exfiltration/result.json','utf8'));
          const deny=JSON.parse(await readFile('xdr/exfiltration/deny-rules.runtime.json','utf8'));
          const log=await readFile('xdr/alerts.log','utf8');
          assert.equal(src.alerts.length,30);
          assert.deepEqual(r.counts,{block:10,alert:10,record:10});
          for(let i=20;i<30;i++)assert.notEqual(r.decisions[i].action,'block');
          assert.equal(deny.rules.length,8);
          for(const rule of deny.rules)assert.ok(Date.parse(rule.expiresAt)>Date.parse(rule.createdAt));
          assert.doesNotMatch(log,/srcip|dstip|srcuser|Bearer\s+|203\.0\.113|192\.0\.2|198\.51\.100/u);
          console.log('XDR-06 block=10 alert=10 record=10 normal-blocked=0 denies=8');
          NODE
