name: XDR-04 persistence verification
on:
  push:
    branches: [bonus-xdr-04-persistence]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test test/xdr-persistence.test.mjs test/xdr-known-cve.test.mjs
      - run: npm run decider:test
      - run: npm run xdr:run -- persistence
      - run: npm run xdr:run -- persistence
      - name: Validate result
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const r=JSON.parse(await readFile('xdr/persistence/result.json','utf8'));
          assert.deepEqual(r.counts,{block:8,alert:8,record:8});
          for(let i=16;i<24;i++)assert.notEqual(r.decisions[i].action,'block');
          console.log('block=8 alert=8 record=8; normal blocked=0');
          NODE
      - name: Commit refreshed result only
        run: |
          git add -- xdr/persistence/result.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "보너스 xdr-04 저장점 결과 갱신"
            git push
          fi
