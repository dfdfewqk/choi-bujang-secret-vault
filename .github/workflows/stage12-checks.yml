name: Stage 12 observed operation room and regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'public/**'
      - 'test/step12-operations.test.mjs'
      - 'scripts/bundle.mjs'
      - 'test/*.test.mjs'
      - 'test/bundle-isolation-preload.mjs'
      - 'scripts/check-public-availability.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'src/stage12-bundle-check.mjs'
      - 'aleph.config.json'
      - '.github/workflows/stage12-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fail on high-severity production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: node --test test/*.test.mjs
      - run: npm run decider:test
      - run: npm run detect:test
      - name: Verify clean checkout can bundle without ignored notes
        run: |
          test ! -e bundle-notes.json
          node --test test/bundle-isolation.test.mjs
      - name: Restricted offline bundle run (GET allowed, network unexecuted)
        run: node --import ./test/bundle-isolation-preload.mjs scripts/bundle.mjs
      - run: npm run bundle
      - name: Independently verify public HTTPS and TLS expiry
        run: node scripts/check-public-availability.mjs
      - name: Validate stage 12 summary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const b=JSON.parse(readFileSync('artifacts/submission.json','utf8'));
          import {execFileSync} from 'node:child_process';
          import {RULE_IDS} from './src/decider.mjs';
          const commit=execFileSync('git',['show','-s','--format=%H','HEAD'],{encoding:'utf8'}).trim();
          const changedFiles=execFileSync('git',['show','--first-parent','-m','--pretty=format:','--name-only','HEAD'],{encoding:'utf8'})
            .split(/\r?\n/u).map(s=>s.trim()).filter(Boolean).sort();
          const unique=new Set(b.attackAttempts.map(r=>r.attackId));
          if(b.schema!=='aleph.defense.submission.v2'||b.step!==12||b.commit!==commit
            ||JSON.stringify(b.changedFiles)!==JSON.stringify([...new Set(changedFiles)])
            ||JSON.stringify(b.policyRules)!==JSON.stringify([...RULE_IDS])
            ||b.attackAttempts.length<1||b.attackAttempts.length>20
            ||unique.size!==b.attackAttempts.length
            ||!b.attackAttempts.some(r=>r.attackId==='stage12_anonymous_operations_denied')
            ||!Number.isFinite(Date.parse(b.checkedAt))
            ||b.attackAttempts.some(r=>Object.keys(r).sort().join(',')!=='attackId,expected,observed,result,stage')
            ||b.attackAttempts.some(r=>!r.observed||!r.expected||!Number.isInteger(r.stage)
              ||r.stage<1||r.stage>12||!['blocked','breached','not_run'].includes(r.result)
              ||!/^(not_run|HTTP [1-5][0-9]{2})$/.test(r.observed)
              ||(r.observed==='not_run')!==(r.result==='not_run')))process.exit(1);
          const unrun=b.attackAttempts.filter(r=>r.observed==='not_run').length;
          console.log(JSON.stringify({step:b.step,commit:b.commit,checks:b.attackAttempts.length,
            observed:b.attackAttempts.length-unrun,notRun:unrun}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-submission
          path: artifacts/submission.json
          retention-days: 90
