name: Stage 12 observed operation room and regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'public/**'
      - 'test/step12-operations.test.mjs'
      - 'scripts/bundle.mjs'
      - 'test/bundle-isolation.test.mjs'
      - 'src/stage12-bundle-check.mjs'
      - 'aleph.config.json'
      - '.github/workflows/stage12-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/*.test.mjs
      - run: npm run decider:test
      - run: npm run detect:test
      - name: Write truthful stage 12 checkpoint
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('bundle-notes.json',JSON.stringify({
            explanation:'12단계: 실제 API 응답의 요청 ID·시각·상태를 가린 서버 기록과 연결한 작전실을 구현했습니다.\n판정기 규칙·API 조회 탐지·기기 상태·복구 감사를 읽고 정상/금지 조회를 실제 결과 표로 확인합니다.\n제공 엔진 출처는 ALEPH SDP 엔진이며 신원 회수 집행과 공식 41종 결과는 미연결·미확인으로 남깁니다.',
            blockedAt:'stage12_official_41_tests_and_identity_revocation_not_verified'
          },null,2));
          NODE
      - name: Restricted Git/HTTPS execution smoke test
        run: node --import ./test/bundle-isolation-preload.mjs scripts/bundle.mjs
      - run: npm run bundle
      - name: Validate stage 12 summary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const b=JSON.parse(readFileSync('artifacts/submission.json','utf8'));
          if(b.step!==12||b.attackAttempts.length>20||!b.attackAttempts.some(r=>r.attackId==='stage12_anonymous_operations_denied'))process.exit(1);
          console.log(JSON.stringify({step:b.step,commit:b.commit,checks:b.attackAttempts.length}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-submission
          path: artifacts/submission.json
          retention-days: 90
