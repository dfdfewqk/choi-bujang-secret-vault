name: HORSE PC dashboard verification
on:
  push:
    branches: ['work/horse-pc-dashboard-20261028']
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check on-client/src/server.mjs
      - run: node --check on-client/src/pc-metrics.mjs
      - run: node --check on-client/public/pc-dashboard.js
      - run: node --check on-client/src/pc-connectivity.mjs
      - run: npm run check
        working-directory: on-client
      - run: node --test on-client/test/student-ui-day4.test.mjs
      - run: node --test on-client/test/pc-metrics.test.mjs on-client/test/pc-integration.test.mjs on-client/test/pc-connectivity.test.mjs
  windows-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test on-client/test/pc-connectivity.test.mjs
      - name: Test ZIP extraction and real one-click local startup (no Git)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'HORSE one click 한글 경로'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item on-client (Join-Path $tmp 'on-client') -Recurse
          Copy-Item HORSE_실행.cmd (Join-Path $tmp 'HORSE_실행.cmd')
          if (Test-Path (Join-Path $tmp '.git')) { throw 'ZIP fixture must not contain .git' }
          $port = 52819
          $launcher = Join-Path $tmp 'on-client/tools/horse-oneclick.ps1'
          $serverPid = $null
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -NoBrowser -Port $port
            if ($LASTEXITCODE -ne 0) { throw "One-click ZIP launcher failed: $LASTEXITCODE" }
            $index = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/" -TimeoutSec 10
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch 'id="pc-dashboard"') { throw 'HORSE HTML is not served' }
            foreach ($asset in @('/pc-dashboard.js','/app.js','/student/extension.mjs')) {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port$asset" -TimeoutSec 8
              if ($r.StatusCode -ne 200 -or [string]::IsNullOrWhiteSpace($r.Content)) { throw "Missing $asset" }
            }
            $metrics = Invoke-RestMethod "http://127.0.0.1:$port/api/pc-status" -TimeoutSec 12
            if ($metrics.ok -ne $true -or $metrics.data.source -ne 'local-os' -or $metrics.data.demo -ne $false) { throw 'PC metrics API failed' }
            $connect = Invoke-RestMethod "http://127.0.0.1:$port/api/pc-connectivity" -TimeoutSec 30
            if ($connect.ok -ne $true -or $connect.data.source -ne 'local-os' -or $connect.data.demo -ne $false) { throw 'Windows connectivity API failed' }
            if ($connect.data.sdp.status -eq 'connected') { throw 'SDP must not be faked in ZIP startup' }
            # Launching again must reuse the existing matching HORSE server.
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -NoBrowser -Port $port
            if ($LASTEXITCODE -ne 0) { throw "Second launch failed: $LASTEXITCODE" }
            Write-Host 'PASS: ZIP -> launcher -> local server -> browser assets -> two real PC APIs -> second launch'
          } finally {
            # CI only: kill the server we started on this private runner/test port.
            $listening = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($listening -and $listening.OwningProcess) {
              Stop-Process -Id $listening.OwningProcess -ErrorAction SilentlyContinue
            }
          }
      - name: Check one-click launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('on-client/tools/horse-oneclick.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          if (-not (Test-Path 'HORSE_실행.cmd')) { throw 'Launcher CMD missing' }
          if (-not (Select-String -Path 'HORSE_실행.cmd' -Pattern 'horse-oneclick.ps1' -Quiet)) { throw 'Launcher CMD not linked' }
