name: HORSE PC dashboard verification
on:
  push:
    branches: ['work/horse-pc-dashboard-20261028']
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check on-client/src/server.mjs
      - run: node --check on-client/src/pc-metrics.mjs
      - run: node --check on-client/public/pc-dashboard.js
      - run: node --check on-client/src/pc-connectivity.mjs
      - run: npm run check
        working-directory: on-client
      - run: node --test on-client/test/student-ui-day4.test.mjs
      - run: node --test on-client/test/pc-metrics.test.mjs on-client/test/pc-integration.test.mjs on-client/test/pc-connectivity.test.mjs
  windows-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test on-client/test/pc-connectivity.test.mjs
      - name: Check one-click launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('on-client/tools/horse-oneclick.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          if (-not (Test-Path 'HORSE_실행.cmd')) { throw 'Launcher CMD missing' }
          if (-not (Select-String -Path 'HORSE_실행.cmd' -Pattern 'horse-oneclick.ps1' -Quiet)) { throw 'Launcher CMD not linked' }
